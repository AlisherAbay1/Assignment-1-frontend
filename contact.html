<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>DevPulse: Contacts</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="css/variables.css" />
        <link rel="stylesheet" href="css/navigation.css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css" />
        <!-- Author: Nurmukhanbet Aral, 13.09.2026 -->
    </head>
    <body class="text-white">
        <header>
            <h1 class="main-headline">Contact Us</h1>
            <div class="logo-and-nav">
                <img 
                    src="images/DevPulse_logo.jpg" 
                    alt="logo of the DevPulse" 
                    id="logo-img" />

                <nav class="nav-links">
                    <a href="index.html">Main</a>
                    <a href="services.html">Services</a>
                    <a href="projects.html">Projects</a>
                    <a href="about.html">About us</a>
                    <a href="contact.html">Contacts</a>
                    <a href="blog.html">Blog</a>
                    <a href="galerea.html">Galerea</a>
                    <a href="faq.html">FAQ</a>
                </nav>
            </div>
        </header>

        <div class="container-fluid border border-dark my-3 mx-1 p-4">
            <div class="row justify-content">
                <div class="col-6">
                    <form action="#" method="post" id="contact-form" class="d-flex flex-column gap-3 align-items-center">
                        <label for="name" class="main-label">Your Name:</label>
                        <input type="text" id="name" name="name" class="form-control w-50" placeholder="Enter your name" required>
                        <label for="email" class="main-label">Your Email:</label>
                        <input type="email" id="email" name="email" class="form-control w-50" placeholder="example@mail.com" required>
                        <label class="main-label">Project Type:</label>
                        <div class="d-flex flex-column">
                            <div class="form-check">
                                <input type="radio" name="project_type" value="landing" id="landing" class="form-check-input">
                                <label for="landing" class="form-check-label">Landing</label>
                            </div>

                            <div class="form-check">
                                <input type="radio" name="project_type" value="fullstack" id="fullstack" class="form-check-input">
                                <label for="fullstack" class="form-check-label">Fullstack</label>
                            </div>

                            <div class="form-check">
                                <input type="radio" name="project_type" value="backend" id="backend" class="form-check-input">
                                <label for="backend" class="form-check-label">Backend</label>
                            </div>

                            <div class="form-check">
                                <input type="radio" name="project_type" value="other" id="other" class="form-check-input">
                                <label for="other" class="form-check-label">Other</label>
                            </div>
                        </div>
                        <label for="brand_color" class="main-label">Project Brand Color:</label>
                        <input type="color" id="brand_color" name="brand_color" class="form-control form-control-color" >
                        <label for="task_desc" class="main-label">Task Description:</label>
                        <textarea id="task_desc" name="task_desc" class="form-control-color w-50" rows="4" placeholder="Describe what needs to be done"></textarea>
                        <button type="submit" class="btn btn-light">Submit Request</button>
                    </form> 
                </div>
                <div class="col-6">
                    <img
                    src="images/DevPulse_location.jpg"
                    alt="Screenshot of the map showing our office location" 
                    class="img-fluid w-100"/>
                </div>
            </div>   
        </div>
        <footer class="ps-2">
            <p>Team: Abay Alisher, Nurmukhanbet Aral</p>
        </footer>
    </body>
</html>
