<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>DevPulse: Contacts</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="css/variables.css" />
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/navigation.css" />
        <link rel="stylesheet" href="css/forms.css" />
        <!-- Author: Nurmukhanbet Aral, 13.09.2026 -->
    </head>
    <body>
        <header>
            <h1 class="main-headline">Contact Us</h1>
            <div class="logo-and-nav">
                <img 
                    src="images/DevPulse_logo.jpg" 
                    alt="logo of the DevPulse" 
                    id="logo-img" />

                <nav class="nav-links">
                    <a href="index.html">Main</a>
                    <a href="services.html">Services</a>
                    <a href="projects.html">Projects</a>
                    <a href="about.html">About us</a>
                    <a href="contact.html">Contacts</a>
                </nav>
            </div>
        </header>
        <section id="contact-section">
            <br /> <br />

            <form action="#" method="post" id="contact-form">
                <label for="name" class="main-label">Your Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>

                <label for="email" class="main-label">Your Email:</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required>

                <label class="main-label">Project Type:</label>

                <div id="project-type-choices">
                    <label><input type="radio" name="project_type" value="landing"> Landing</label>
                    <label><input type="radio" name="project_type" value="fullstack"> Fullstack</label>
                    <label><input type="radio" name="project_type" value="backend"> Backend</label>
                    <label><input type="radio" name="project_type" value="other"> Other</label>
                </div>

                <label for="brand_color" class="main-label">Project Brand Color:</label>
                <input type="color" id="brand_color" name="brand_color">

                <label for="task_desc" class="main-label">Task Description:</label>
                <textarea id="task_desc" name="task_desc" rows="4" placeholder="Describe what needs to be done"></textarea>

                <button type="submit">Submit Request</button>
            </form>

            <img
                src="images/DevPulse_location.jpg"
                alt="Screenshot of the map showing our office location" />
        </section>

        <footer>
            <p>Team: Abay Alisher, Nurmukhanbet Aral</p>
        </footer>
    </body>
</html>
