<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>DevPulse: Contacts</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="css/style.css" />
        <!-- Author: Nurmukhanbet Aral, 13.09.2026 -->
    </head>
    <body>
        <header>
            <h1 class="main-headline">PAGE HEADLINE</h1>
            <nav class="nav-links">
                <a href="index.html">Main</a>
                <a href="services.html">Services</a>
                <a href="projects.html">Projects</a>
                <a href="about.html">About us</a>
                <a href="contact.html">Contacts</a>
            </nav>
        </header>
       <main>
            <h1>Contact Us</h1>

            <form action="#" method="post" id="contact-form">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

                <label for="email">Your Email:</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required><br><br>

                <label>Project Type:</label><br>
                <input type="radio" id="landing" name="project_type" value="landing">
                <label for="landing">Landing</label><br>
                <input type="radio" id="fullstack" name="project_type" value="fullstack">
                <label for="fullstack">Fullstack</label><br>
                <input type="radio" id="backend" name="project_type" value="backend">
                <label for="backend">Backend</label><br>
                <input type="radio" id="other" name="project_type" value="other">
                <label for="other">Other</label><br><br>

                <label for="brand_color">Project Brand Color:</label>
                <input type="color" id="brand_color" name="brand_color"><br><br>

                <label for="task_desc">Task Description:</label><br>
                <textarea id="task_desc" name="task_desc" rows="4" placeholder="Describe what needs to be done"></textarea><br><br>

                <button type="submit">Submit Request</button>
            </form>

            <br>
            <img
                src="images/map_location1.png"
                alt="Screenshot of the map showing our office location"
                width="50%" />
        </main>

            <p>Team: Abay Alisher, Nurmukhanbet Aral</p>
        </footer>
    </body>
</html>
