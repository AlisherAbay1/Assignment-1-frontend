        <h1 id="galerea-apps">Apps that we worked on</h1>

        <div id="galerea" class="carousel carousel-dark slide w-50 mx-auto mt-5">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#galerea" data-bs-slide-to="0" class="active" aria-current="true" aria-label="duolingo slide"></button>
                <button type="button" data-bs-target="#galerea" data-bs-slide-to="1" aria-label="canva slide"></button>
                <button type="button" data-bs-target="#galerea" data-bs-slide-to="2" aria-label="facebook slide"></button>
                <button type="button" data-bs-target="#galerea" data-bs-slide-to="3" aria-label="netflix slide"></button>
                <button type="button" data-bs-target="#galerea" data-bs-slide-to="4" aria-label="ozon slide"></button>
                <button type="button" data-bs-target="#galerea" data-bs-slide-to="5" aria-label="telegram slide"></button>
                <button type="button" data-bs-target="#galerea" data-bs-slide-to="6" aria-label="twitch slide"></button>
                <button type="button" data-bs-target="#galerea" data-bs-slide-to="7" aria-label="twitter slide"></button>
                <button type="button" data-bs-target="#galerea" data-bs-slide-to="8" aria-label="youtube slide"></button>            
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="images/galerea/duolingo.png" alt="duolingo icon" class="img-fluid d-block w-100">
                </div>
                <div class="carousel-item">
                    <img src="images/galerea/canva.jpg" alt="canva icon" class="img-fluid d-block w-100">
                </div>
                <div class="carousel-item">
                    <img src="images/galerea/facebook.png" alt="facebook icon" class="img-fluid d-block w-100">
                </div>
                <div class="carousel-item">
                    <img src="images/galerea/netflix.png" alt="netflix icon" class="img-fluid d-block w-100">
                </div>
                <div class="carousel-item">
                    <img src="images/galerea/ozon.jpg" alt="ozon icon" class="img-fluid d-block w-100">
                </div>
                <div class="carousel-item">
                    <img src="images/galerea/telegram.png" alt="telegram icon" class="img-fluid d-block w-100">
                </div>
                <div class="carousel-item">
                    <img src="images/galerea/twitch.png" alt="twitch icon" class="img-fluid d-block w-100">
                </div>
                <div class="carousel-item">
                    <img src="images/galerea/twitter.png" alt="twitter icon" class="img-fluid d-block w-100">
                </div>
                <div class="carousel-item">
                    <img src="images/galerea/youtube.jpg" alt="youtube icon" class="img-fluid d-block w-100">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#galerea" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#galerea" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>

        <footer class="m-2 m-sm-1">
            <p>Team: Abay Alisher, Nurmukhanbet Aral</p>
        </footer>
