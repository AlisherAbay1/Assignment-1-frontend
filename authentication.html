<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DevPulse: Authentication</title>
        <link rel="stylesheet" href="css/variables.css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/navbar.css" />
        <link rel="stylesheet" href="css/auth.css" />
        <link rel="stylesheet" href="css/buttons.css" />
    </head>
    <body>
        <header>
            <div class="headline-container">
                <h1 class="main-headline">Authentication</h1>
            </div>
            <nav class="navbar navbar-expand-lg p-0  mb-3">
                <div class="container-fluid">
                    <a class="navbar-brand" href="index.html">
                        <img src="images/devpulse-logo.jpg" alt="logo of the DevPulse" width="60" class="rounded-circle">
                    </a>
                    <button 
                        class="navbar-toggler" 
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbar-menu">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbar-menu">
                        <div class="navbar-nav justify-content-evenly w-100">
                            <a href="index.html" class="nav-link rounded-3">Main</a>
                            <a href="services.html" class="nav-link rounded-3">Services</a>
                            <a href="projects.html" class="nav-link rounded-3">Projects</a>
                            <a href="about.html" class="nav-link rounded-3">About us</a>
                            <a href="contact.html" class="nav-link rounded-3">Contacts</a>
                            <a href="blog.html" class="nav-link rounded-3">Blog</a>
                            <a href="faq.html" class="nav-link rounded-3">FAQ</a>
                        </div>
                    </div>
                    <a href='authentication.html' class="auth btn" aria-label="Log in or sign up">
                        <i class="bi bi-person"></i>
                    </a>
                    <button class="change-theme btn"><i class="bi bi-moon-fill"></i></button>
                </div>
            </nav>
        </header>
        <main>
            <div class="auth-container">
                <ul class="nav nav-tabs nav-fill" id="auth-tabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="login-tab"
                                data-bs-toggle="tab" data-bs-target="#login-pane"
                                type="button" role="tab" aria-controls="login-pane" aria-selected="true">
                            Log in
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="signup-tab"
                                data-bs-toggle="tab" data-bs-target="#signup-pane"
                                type="button" role="tab" aria-controls="signup-pane" aria-selected="false">
                            Sign up
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="auth-tab-content">
                    <div class="tab-pane fade show active" id="login-pane" role="tabpanel" aria-labelledby="login-tab">
                        <form action="#" method="post" id="login-form" class="d-flex flex-column gap-2 align-items-center mt-3" novalidate>
                            <label for="login-email" class="main-label">Email:</label>
                            <input type="text" id="login-email" name="email" class="form-control w-50" placeholder="Enter your email">
                            <small id="login-email-error" class="text-danger" hidden></small>
                            <label for="login-password" class="main-label">Password:</label>
                            <div class="input-group w-50">
                                <input type="password" id="login-password" name="password" class="form-control" placeholder="Enter your password">
                                <button class="btn bg-white" type="button" id="login-toggle-password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <small id="login-password-error" class="text-danger" hidden></small>
                            <button type="submit" class="btn submit-auth-button" id="login-button">
                                <span>Submit</span>
                            </button>
                        </form>
                        <div class="bg-danger text-white border border-info-subtle p-2 m-2" id="login-form-error" hidden></div>
                        <div class="bg-success text-white border border-info-subtle p-2 m-2" id="login-form-success" hidden></div> 
                    </div>
                    <div class="tab-pane fade" id="signup-pane" role="tabpanel" aria-labelledby="signup-tab">
                        <form action="#" method="post" id="signup-form" class="d-flex flex-column gap-2 align-items-center mt-3" novalidate>
                            <label for="nickname" class="main-label">Nickname:</label>
                            <input type="text" id="nickname" name="nickname" class="form-control w-50" placeholder="Enter your nickname">
                            <small id="nickname-error" class="text-danger" hidden></small>
                            <label for="phone" class="main-label">Phone:</label>
                            <input type="text" id="phone" name="phone" class="form-control w-50" placeholder="Enter your phone number">
                            <small id="phone-error" class="text-danger" hidden></small>
                            <label for="email" class="main-label">Email:</label>
                            <input type="text" id="email" name="email" class="form-control w-50" placeholder="Enter your email">
                            <small id="email-error" class="text-danger" hidden></small>
                            <label for="password" class="main-label">Password:</label>
                            <div class="input-group w-50">
                                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password">
                                <button class="btn bg-white" type="button" id="toggle-password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <small id="password-error" class="text-danger" hidden></small>
                            <label for="confirm-password" class="main-label">Confirm password:</label>
                            <div class="input-group w-50">
                                <input type="password" id="confirm-password" name="confirm-password"
                                    class="form-control" placeholder="Confirm your password">
                                <button class="btn bg-white" type="button" id="toggle-confirm-password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <small id="confirm-password-error" class="text-danger" hidden></small>
                            <button type="submit" class="btn submit-auth-button" id="signup-button">
                                <span>Submit</span>
                            </button>
                        </form>
                        <div class="bg-danger text-white border border-info-subtle p-2 m-2" id="form-error" hidden></div>
                        <div class="bg-success text-white border border-info-subtle p-2 m-2" id="form-success" hidden></div>  
                    </div>
                </div>
            </div>
        </main>
        <footer class="m-2 m-sm-1">
            <p>Team: Abay Alisher, Nurmukhanbet Aral</p>
        </footer>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
        <script src="js/auth.js"></script>
    </body>
</html>
